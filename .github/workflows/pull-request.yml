name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Validate realm JSON
        run: jq empty keycloak/pulse-pass-realm.json
      - name: Start infrastructure
        run: ./infrastructure-start.sh
      - name: Check realm is served
        run: curl -f http://localhost:8180/realms/pulse-pass
      - name: Check service account permissions and realm roles
        run: |
          set -euo pipefail
          token=$(curl -sf http://localhost:8180/realms/pulse-pass/protocol/openid-connect/token \
            -d grant_type=client_credentials \
            -d client_id=onboarding-service \
            -d client_secret="$(grep -E '^ONBOARDING_SERVICE_CLIENT_SECRET=' .env | cut -d= -f2)" | jq -r .access_token)
          test -n "$token" && test "$token" != "null"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            http://localhost:8180/admin/realms/pulse-pass/roles/organizer)
          test "$status" = "200"
          for role in buyer organizer admin; do
            curl -sf -H "Authorization: Bearer $token" \
              "http://localhost:8180/admin/realms/pulse-pass/roles/$role" >/dev/null
          done
      - name: Check refresh token rotation
        run: |
          set -euo pipefail
          token_url=http://localhost:8180/realms/pulse-pass/protocol/openid-connect/token
          client_secret="$(grep -E '^ONBOARDING_SERVICE_CLIENT_SECRET=' .env | cut -d= -f2)"
          admin_username="$(jq -r '.users[] | select(.realmRoles // [] | index("admin")) | .username' keycloak/pulse-pass-realm.json)"
          admin_password="$(grep -E '^BACKOFFICE_ADMIN_PASSWORD=' .env | cut -d= -f2)"
          request_token() {
            curl -s -w '\n%{http_code}' "$token_url" \
              -d client_id=onboarding-service \
              -d client_secret="$client_secret" \
              "$@"
          }
          expect_invalid_grant() {
            response="$(request_token -d grant_type=refresh_token -d refresh_token="$1")"
            test "$(tail -n1 <<<"$response")" = "400"
            test "$(sed '$d' <<<"$response" | jq -r .error)" = "invalid_grant"
          }
          login_response="$(request_token -d grant_type=password -d username="$admin_username" -d password="$admin_password")"
          test "$(tail -n1 <<<"$login_response")" = "200"
          first_refresh="$(sed '$d' <<<"$login_response" | jq -r .refresh_token)"
          test -n "$first_refresh" && test "$first_refresh" != "null"
          refresh_response="$(request_token -d grant_type=refresh_token -d refresh_token="$first_refresh")"
          test "$(tail -n1 <<<"$refresh_response")" = "200"
          second_refresh="$(sed '$d' <<<"$refresh_response" | jq -r .refresh_token)"
          test -n "$second_refresh" && test "$second_refresh" != "null"
          expect_invalid_grant "$first_refresh"
          expect_invalid_grant "$second_refresh"
      - name: Check MySQL, Redis and Kafka
        run: |
          set -euo pipefail
          docker exec pulse-pass-mysql sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"' >/dev/null
          test "$(docker exec pulse-pass-redis redis-cli ping)" = "PONG"
          kafka_topics=/opt/kafka/bin/kafka-topics.sh
          docker exec pulse-pass-kafka "$kafka_topics" --bootstrap-server localhost:9092 --create --topic ci-check
          topics="$(docker exec pulse-pass-kafka "$kafka_topics" --bootstrap-server localhost:9092 --list)"
          grep -qx ci-check <<<"$topics"
          topics="$(docker exec pulse-pass-kafka "$kafka_topics" --bootstrap-server localhost:9094 --list)"
          grep -qx ci-check <<<"$topics"
          topics="$(docker run --rm --network pulse-pass apache/kafka:3.9.1 "$kafka_topics" --bootstrap-server pulse-pass-kafka:9092 --list)"
          grep -qx ci-check <<<"$topics"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop infrastructure
        if: always()
        run: ./infrastructure-stop.sh
