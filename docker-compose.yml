name: pulse-pass-infrastructure

services:
  pulse-pass-keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: pulse-pass-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_RSA_PRIVATE_KEY: ${KEYCLOAK_RSA_PRIVATE_KEY:?}
      KEYCLOAK_RSA_CERTIFICATE: ${KEYCLOAK_RSA_CERTIFICATE:?}
      ONBOARDING_SERVICE_CLIENT_SECRET: ${ONBOARDING_SERVICE_CLIENT_SECRET:?}
      BACKOFFICE_ADMIN_PASSWORD: ${BACKOFFICE_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - pulse-pass

  pulse-pass-mysql:
    image: mysql:8.0
    container_name: pulse-pass-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - pulse-pass

  pulse-pass-redis:
    image: redis:7.4
    container_name: pulse-pass-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pulse-pass

  pulse-pass-kafka:
    image: apache/kafka:3.9.1
    container_name: pulse-pass-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:${KAFKA_PORT:-9094},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://pulse-pass-kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:${KAFKA_PORT:-9094}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - pulse-pass

networks:
  pulse-pass:
    external: true
